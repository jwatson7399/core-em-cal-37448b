<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Posting">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Posting calendar</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--card2:#eef1f5;--text:#0f172a;--muted:#5b6474;--line:#e1e5eb;
  --accent:#0f766e;--accentText:#fff;
  --planned:#1d4ed8;--posted:#15803d;--missed:#b91c1c;--resched:#b45309;--chipText:#fff;
  --tab-h:58px;--radius:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f17;--card:#151b26;--card2:#1c2432;--text:#e7eaf0;--muted:#9aa3b2;--line:#263041;
  --accent:#2dd4bf;--accentText:#042f2e;
  --planned:#60a5fa;--posted:#4ade80;--missed:#f87171;--resched:#fbbf24;--chipText:#0b0f17;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 var(--font);overflow-x:hidden}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--safe-t) + 6px) 16px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.stamp{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Views */
main{padding:12px 16px calc(var(--tab-h) + var(--safe-b) + 24px)}
.view{display:none}.view.on{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 4px 8px}
h2:first-child{margin-top:4px}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px;background:var(--card2);display:flex;gap:10px;align-items:center}
.banner.warn{border-left:4px solid var(--resched)}
.banner.bad{border-left:4px solid var(--missed)}
.banner button{min-height:44px;padding:0 6px;margin-left:auto;font-weight:600;color:var(--accent);white-space:nowrap}
.empty{padding:16px;border-radius:var(--radius);background:var(--card);color:var(--muted);text-align:center}

/* Chips and pills */
.chip{position:relative;display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;font-weight:800;font-size:12px;color:var(--chipText);letter-spacing:.02em;flex:none}
.chip .sym{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:inherit}
.chip .sym svg{width:11px;height:11px}
.s-planned{background:var(--planned)}.s-posted{background:var(--posted)}.s-missed{background:var(--missed)}.s-rescheduled{background:var(--resched)}
.c-planned{color:var(--planned)}.c-posted{color:var(--posted)}.c-missed{color:var(--missed)}.c-rescheduled{color:var(--resched)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pill svg{width:11px;height:11px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted);margin:0 4px 4px 0}
.tag.local{color:var(--accent)}
.tag.quiet{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* Full cards (Today) */
.card{position:relative;border-radius:var(--radius);margin:0 0 12px;overflow:hidden;background:var(--card2)}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:700;color:#fff}
.swipe-bg .l{opacity:0}.swipe-bg .r{opacity:0}
.card.go-r .swipe-bg{background:var(--posted)}.card.go-r .l{opacity:1}
.card.go-l .swipe-bg{background:var(--resched)}.card.go-l .r{opacity:1}
.fg{position:relative;background:var(--card);padding:14px;border-radius:var(--radius);touch-action:pan-y;transition:transform .2s ease}
.fg.dragging{transition:none}
.card-h{display:flex;gap:10px;align-items:flex-start}
.card-h .ttl{flex:1;min-width:0}
.t1{font-weight:700;font-size:16px;line-height:1.25}
.t2{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none}
.thumb.ph{display:grid;place-items:center;font-size:11px;color:var(--muted)}
.txt{white-space:pre-wrap;font-size:15px;margin:10px 0 6px;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:14px;font-weight:600;color:var(--accent);min-height:44px;padding:0 2px;margin:-6px 0 0}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:44px;border-radius:12px;background:var(--card2);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.btn.primary{background:var(--accent);color:var(--accentText);flex:2;white-space:nowrap}
.btn.sq{flex:0 0 56px;padding:0}
.btn.ok{background:var(--posted);color:var(--chipText)}
.btn[disabled]{opacity:.45}
.btn svg{width:18px;height:18px}
.card.done .fg{opacity:.7}

/* Compact rows */
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;background:var(--card);margin-bottom:8px}
.row .rt{flex:1;min-width:0}
.row .r1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r2{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.row .thumb{width:44px;height:44px}

/* Merged calendar: month grid on top, swipeable week below */
#v-calendar.on{display:flex;flex-direction:column;max-height:calc(100dvh - var(--safe-t) - 62px - var(--tab-h) - var(--safe-b) - 12px);min-height:0;overflow:hidden}
.weekbar{display:flex;align-items:center;gap:8px;margin:8px 4px 8px}
.weekbar .lbl{flex:1;font-weight:700}
.smallbtn{font-size:14px;font-weight:600;padding:0 14px;min-height:44px;border-radius:999px;background:var(--card2)}
.strip{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 7.5%;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:160px;align-items:stretch;overscroll-behavior-x:contain;touch-action:pan-x}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 85%;scroll-snap-align:center;scroll-snap-stop:always;background:var(--card2);border-radius:20px;padding:14px;height:auto;min-height:0;max-height:100%;overflow:hidden;display:flex;flex-direction:column}
.day h3{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.day.is-today h3 .tb{font-size:12px;background:var(--accent);color:var(--accentText);padding:2px 8px;border-radius:999px}
.day .row{background:var(--card)}
.day .nothing{color:var(--muted);margin:auto;text-align:center;font-size:15px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}

/* Month */
.monthbar{display:flex;align-items:center;gap:8px;margin:0 0 6px;flex:none}
.monthbar .lbl{flex:1;text-align:center;font-weight:700;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;width:100%;margin:0;flex:none}
.wd{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding:2px 0 4px}
.cell{min-height:44px;width:100%;border-radius:8px;background:transparent;padding:3px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;color:inherit;overflow:hidden}
.cell.blank{background:transparent}
.cell.in-week{background:var(--card2)}
.cell.focus{outline:2px solid var(--accent);outline-offset:-2px}
.cell.focus:not(.in-week){background:transparent}
.cell.out{opacity:.4}
.cell .n{font-size:13px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cell.today .n{background:var(--accent);color:var(--accentText)}
.cell.past .n{color:var(--muted)}
.cell .chip{min-width:0;width:22px;height:14px;font-size:8px;border-radius:4px;padding:0}
.cell .chip .sym{width:10px;height:10px;right:-3px;bottom:-3px}
.cell .chip .sym svg{width:8px;height:8px}
.cell .plus{font-size:9px;color:var(--muted)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tab{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--missed);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* Bottom sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(var(--safe-b) + 16px);transform:translateY(100%);transition:transform .25s ease;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheethead{position:sticky;top:-8px;margin:-8px -16px 4px;padding:8px 16px 4px;background:var(--card);z-index:2;display:flex;align-items:center}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.closebtn{position:absolute;right:8px;top:2px;font-weight:600;color:var(--accent);min-height:44px;min-width:44px;padding:0 10px}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .txt{background:var(--card2);border-radius:12px;padding:12px;user-select:text;-webkit-user-select:text}
.sheet .acts{flex-wrap:wrap}
.sheet .acts .btn{flex:1 1 45%}
.links{margin:14px 0 4px}
.links a{display:flex;align-items:center;min-height:44px;padding:0 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}
.links a.first{font-weight:700}
.note{font-size:13px;color:var(--muted);margin:6px 2px}
.keyrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.datein{width:100%;min-height:48px;font:inherit;font-size:17px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 12px);z-index:50;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15px;transform:translateY(150%);opacity:0;visibility:hidden;pointer-events:none;transition:transform .2s ease,opacity .2s,visibility .2s}
.toast.on{transform:none;opacity:1;visibility:visible;pointer-events:auto}
.toast button{min-height:44px;min-width:44px;margin:-10px 0 -10px auto;font-weight:700;color:var(--accent)}
@media (prefers-color-scheme:dark){.toast button{color:#0f766e}}
/* Playbook (X only). Every value shown here comes from playbook.json. */
.jump{position:sticky;top:var(--top-h,57px);z-index:15;background:var(--bg);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:-12px -16px 8px;padding:8px 16px;border-bottom:1px solid var(--line);overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600;white-space:nowrap}
.jump button.on{background:var(--accent);color:var(--accentText)}
.jump .ct{font-weight:500;opacity:.75;margin-left:5px}
.pbsec{scroll-margin-top:calc(var(--top-h,57px) + 72px)}
.box{background:var(--card);border-radius:var(--radius);padding:14px;margin:0 0 12px;min-width:0;overflow-wrap:anywhere}
.box h3{margin:0;font-size:17px;line-height:1.25}
.box .lead{font-size:15px;margin:8px 0 0}
.asof{font-size:12px;color:var(--muted);margin-top:2px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.delta{font-size:14px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.kv div{background:var(--card2);border-radius:10px;padding:8px 6px;min-width:0}
.kv b{display:block;font-size:15px}
.kv span{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.kv.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
.spark{display:block;width:100%;height:40px;margin-top:8px;color:var(--accent);overflow:visible}
.sparkax{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;min-width:0}
.tile .lb{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:22px;font-weight:800;line-height:1.2}
.tile .sub{font-size:11px;color:var(--muted)}
.tile .spark{height:32px}
.prow{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--card);margin-bottom:8px;min-height:44px}
.prow .r1{font-weight:600;font-size:15px}
.prow .r2{font-size:13px;color:var(--muted);margin-top:2px}
.metrics{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:4px}
.metrics b{color:var(--text);font-weight:700}
.metrics .vv{color:var(--muted);font-style:italic}
.top3{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.top3:first-of-type{border-top:0}
.top3 .tt{flex:1;min-width:0}
.rank{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:800;flex:none}
.xlink{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none}
.blist{margin:8px 0 0;padding-left:20px;font-size:14px}
.blist li{margin:4px 0}
.rule{position:relative}
.rule .tap{cursor:pointer;outline:none}
.rule .tap:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:10px}
.rule .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.rule .rd{font-size:14px;margin-top:8px}
.rule:not(.open) .rd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rule .src{display:none;font-size:12px;color:var(--muted);margin-top:8px}
.rule.open .src{display:block}
.rule .more2{display:flex;align-items:center;min-height:44px;margin:0 0 -10px;font-size:14px;font-weight:600;color:var(--accent)}
.rule.proposed{border:1.5px dashed var(--resched)}
.ptag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;color:var(--resched);white-space:nowrap}
.dtag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
details.box{padding:0 14px}
details.box>summary,details.inner>summary{list-style:none;min-height:48px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:10px 0}
details.inner{margin-top:10px;border-top:1px solid var(--line)}
details.inner>summary{min-height:44px;font-size:14px;color:var(--accent)}
summary::-webkit-details-marker{display:none}
summary .sm{flex:1;min-width:0}
summary .chev{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
details.box>.body{padding:0 0 14px}
.find{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.find .fh{font-weight:600}
.find .fnum{color:var(--muted);margin-top:3px}
.find .dtag{margin-top:6px}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:14px 0 4px}
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;table-layout:fixed}
.cmp th,.cmp td{text-align:right;padding:8px 2px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.cmp th:first-child,.cmp td:first-child{text-align:left;width:38%}
.cmp th{font-size:12px;color:var(--muted);font-weight:600;vertical-align:bottom}
.cmp td.na{color:var(--muted);font-style:italic}
.cmp .chg{display:block;font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.path{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.srcs{margin:4px 0 0;padding:0;list-style:none}
.srcs li{padding:4px 0}
.srcs a{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;text-decoration:none}
.hook{padding:10px 0;border-top:1px solid var(--line)}
.hook:first-child{border-top:0}
.hook .hd{font-size:12px;color:var(--muted);font-weight:600}
.hook .hq{font-size:15px;margin-top:2px}
.samp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.samp div{background:var(--card2);border-radius:10px;padding:8px;min-width:0}
.samp b{display:block;font-size:16px}
.samp span{display:block;font-size:11px;color:var(--muted);line-height:1.25}
.kvline{font-size:13px;margin-top:6px}
.kvline span{color:var(--muted)}
.st-active{color:var(--planned)}.st-done{color:var(--posted)}.st-stopped{color:var(--missed)}.st-other{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Today</h1>
  <div class="stamp" id="stamp">Loading</div>
  <button class="iconbtn" id="refresh" aria-label="Refresh data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
  </button>
  <button class="iconbtn" id="help" aria-label="Show key">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
  </button>
</header>

<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-calendar">
    <div class="monthbar">
      <button class="iconbtn" id="m-prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="lbl" id="monthlbl"></div>
      <button class="iconbtn" id="m-next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="weekbar"><div class="lbl" id="weeklbl"></div><button class="smallbtn" id="wk-today">Today</button></div>
    <div class="strip" id="strip"></div>
  </section>
  <section class="view" id="v-playbook"></section>
</main>

<nav class="tabs" aria-label="Views">
  <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today<span class="badge hidden" id="badge"></span></button>
  <button class="tab" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="tab" data-tab="playbook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 4.5v14c3.5 0 6.5.5 8.5 2 2-1.5 5-2 8.5-2v-14C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v14"/></svg>Playbook</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheethead"><div class="grab"></div><button class="closebtn" data-act="close">Close</button></div><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo">Undo</button></div>

<script>
"use strict";
/* ---------- Settings ---------- */
const TZ = "America/New_York";
const DATA_URL = "data.json";
// App links tried after copying. Undocumented by X and Instagram: test on your phone.
const OPEN_APP = {
  X: (text) => "twitter://post?message=" + encodeURIComponent(text),
  IG: () => "instagram://app"
};
const PLATFORM_NAME = { X: "X", IG: "Instagram" };
const OV_KEY = "pc.overrides.v1", DATA_KEY = "pc.lastData.v1";
const PB_URL = "playbook.json", PB_KEY = "pc.lastPlaybook.v1";
const PB_SCHEMA = 1; // highest playbook.json schemaVersion this page knows how to show

/* ---------- Small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function todayET() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
const toUTC = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = (t) => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => fromUTC(toUTC(s) + n * 864e5);
const fmt = (s, o) => new Date(toUTC(s)).toLocaleDateString("en-US", { timeZone: "UTC", ...o });
const fmtDay = (s) => fmt(s, { weekday: "short", month: "short", day: "numeric" });
const weekday = (s) => new Date(toUTC(s)).getUTCDay();
const weekStartOf = (s) => addDays(s, -weekday(s));
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");

const SYM = {
  posted: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.3 2.3L9.5 3.8"/></svg>',
  planned: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3.6"/></svg>',
  missed: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>',
  rescheduled: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h7.5M6.5 3l3 3-3 3"/></svg>'
};
const STATUS_LABEL = { posted: "Posted", planned: "Planned", missed: "Missed", rescheduled: "Moved" };
const ICON = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};
const chip = (p, status) => `<span class="chip s-${status}" aria-label="${esc(PLATFORM_NAME[p] || p)}, ${STATUS_LABEL[status]}">${esc(p)}<span class="sym c-${status}">${SYM[status]}</span></span>`;
const pill = (status) => `<span class="pill c-${status}">${SYM[status]}${STATUS_LABEL[status]}</span>`;

/* ---------- State ---------- */
const S = {
  raw: null, items: [], byKey: new Map(), byDate: new Map(),
  overrides: store.get(OV_KEY, {}),
  today: todayET(), view: "today", selected: todayET(), month: todayET().slice(0, 7),
  genDate: null, stampText: "", offline: false, expired: false, loadedAt: 0,
  prepared: {}, stripBuiltFor: null,
  // Playbook tab state. pbOpen remembers which panels were opened so a refresh keeps them.
  pb: null, pbOffline: false, pbExpired: false, pbBad: false, pbOpen: new Map()
};
const saveOv = () => store.set(OV_KEY, S.overrides);
const pid = (p) => p.id || [p.date, p.platform, p.title].join("|");

/* ---------- Data loading ---------- */
/* The refresh button, first launch, and coming back to the app all reload both files. */
async function load() {
  $("#refresh").classList.add("spin");
  await Promise.all([loadCalendar(), loadPlaybook()]);
  $("#refresh").classList.remove("spin");
  render();
}

async function loadCalendar() {
  let data = null, fromCache = false;
  try {
    const res = await fetch(DATA_URL, { cache: "no-store", redirect: "manual", credentials: "same-origin" });
    if (res.type === "opaqueredirect" || res.status === 401 || res.status === 403) {
      S.expired = true;
    } else if (res.ok) {
      data = await res.json();
      fromCache = res.headers.get("x-from-cache") === "1";
      S.expired = false;
    }
  } catch (e) { /* offline */ }
  if (data) store.set(DATA_KEY, data);
  else { data = store.get(DATA_KEY, null); fromCache = !!data; }
  S.offline = fromCache && !S.expired;
  S.loadedAt = Date.now();
  S.today = todayET();
  if (data && Array.isArray(data.posts)) {
    S.raw = data;
    readStamp();
    reconcile();
    derive();
  }
}

async function loadPlaybook() {
  let pb = null, res = null, fromCache = false;
  S.pbExpired = false; S.pbBad = false;
  try {
    res = await fetch(PB_URL, { cache: "no-store", redirect: "manual", credentials: "same-origin" });
    if (res.type === "opaqueredirect" || res.status === 401 || res.status === 403) S.pbExpired = true;
  } catch (e) { res = null; /* offline */ }
  if (res && res.ok && !S.pbExpired) {
    try {
      pb = await res.json();
      fromCache = res.headers.get("x-from-cache") === "1";
    } catch (e) { pb = null; S.pbBad = true; }
    if (pb && (typeof pb !== "object" || Array.isArray(pb))) { pb = null; S.pbBad = true; }
  }
  if (pb) store.set(PB_KEY, pb);
  else { pb = store.get(PB_KEY, null); fromCache = !!pb; }
  S.pb = pb;
  S.pbOffline = fromCache && !S.pbExpired && !S.pbBad;
}

function readStamp() {
  const d = S.raw;
  let date = null, time = null;
  if (d.generatedAt && !isNaN(Date.parse(d.generatedAt))) {
    const g = new Date(d.generatedAt);
    date = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(g);
    time = g.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
  } else if (d.dataAsOf) {
    const m = String(d.dataAsOf).match(/([A-Za-z]+ \d{1,2}, \d{4}),?\s*(\d{1,2}:\d{2}\s*[AP]M)/);
    if (m) {
      const t = new Date(m[1] + " 12:00");
      if (!isNaN(t)) date = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
      time = m[2];
    }
  }
  S.genDate = date;
  S.stampText = time ? "Updated " + (date && date !== S.today ? fmt(date, { month: "short", day: "numeric" }) + ", " : "") + time + " ET" : "Updated time unknown";
}

/* Phone-only changes stay until the Sheet catches up. */
function reconcile() {
  const posts = S.raw.posts;
  const byId = new Map(posts.map((p) => [pid(p), p]));
  const same = (a, b) => a.platform === b.platform && a.title === b.title;
  let changed = false;
  for (const [id, o] of Object.entries(S.overrides)) {
    const p = byId.get(id);
    let drop = !p || (!o.posted && !o.resched);
    if (p && !drop) {
      const sheetMoved = /^RESCHEDULED/i.test(p.sheetStatus || "");
      if (o.posted) {
        drop = p.posted || posts.some((q) => q.posted && same(q, p) && q.date >= p.date);
        if (!drop && o.resched && sheetMoved) {
          // Sheet made the new row: carry the phone-only "posted" over to it.
          const target = posts.find((q) => same(q, p) && q.date > p.date && !/^RESCHEDULED/i.test(q.sheetStatus || ""));
          if (target) S.overrides[pid(target)] = { posted: true, at: o.at };
          drop = true;
        }
      } else if (o.resched) {
        drop = p.posted || sheetMoved;
      }
    }
    if (o.at && Date.now() - Date.parse(o.at) > 30 * 864e5) drop = true;
    if (drop) { delete S.overrides[id]; changed = true; }
  }
  if (changed) saveOv();
}

function derive() {
  const t = S.today, paused = !!S.raw.igPaused, out = [];
  const due = (p, date) => (date < t && !(paused && p.platform === "IG") ? "missed" : "planned");
  for (const p of S.raw.posts) {
    const id = pid(p), o = S.overrides[id], ss = p.sheetStatus || "";
    const m = ss.match(/(\d{4}-\d{2}-\d{2})/);
    const base = { ...p, id, baseId: id, media: p.media || [], postText: p.postText || "", local: null, movedTo: null };
    if (p.posted) { out.push({ ...base, key: id, status: "posted" }); continue; }
    if (/^RESCHEDULED/i.test(ss)) { out.push({ ...base, key: id, status: "rescheduled", movedTo: m ? m[1] : null }); continue; }
    if (o && o.resched) {
      out.push({ ...base, key: id, status: "rescheduled", movedTo: o.resched, local: "moved" });
      out.push({ ...base, key: id + ">" + o.resched, date: o.resched, origDate: p.date, virtual: true,
        status: o.posted ? "posted" : due(p, o.resched), local: o.posted ? "posted" : "moved" });
      continue;
    }
    if (o && o.posted) { out.push({ ...base, key: id, status: "posted", local: "posted" }); continue; }
    out.push({ ...base, key: id, status: due(p, p.date) });
  }
  const order = { X: 0, IG: 1 };
  out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (order[a.platform] ?? 2) - (order[b.platform] ?? 2)));
  S.items = out;
  S.byKey = new Map(out.map((i) => [i.key, i]));
  S.byDate = new Map();
  for (const i of out) { if (!S.byDate.has(i.date)) S.byDate.set(i.date, []); S.byDate.get(i.date).push(i); }
  S.stripBuiltFor = null;
}

const isOpen = (i) => i.status === "planned" || i.status === "missed";
function textState(i) {
  return i.textStatus === "awaiting_ok" ? "awaiting_ok" : "drafting";
}
function mediaGaps(i) {
  if (/TO MAKE/i.test(i.sheetStatus || "")) return ["Needs media made"];
  if (!(i.media && i.media.length)) return ["No media link"];
  return [];
}
function prepGaps(i) {
  const g = mediaGaps(i);
  if (!(i.postText || "").trim() && i.date <= addDays(S.today, 1)) {
    g.push(textState(i) === "awaiting_ok" ? "Draft waiting for your OK" : "No post text yet");
  }
  return g;
}
function quietText(i) {
  if ((i.postText || "").trim() || i.date <= addDays(S.today, 1)) return "";
  return textState(i) === "awaiting_ok" ? "Draft sent for your OK" : "Bot drafting text";
}
function pendingChanges() {
  const list = [];
  for (const [id, o] of Object.entries(S.overrides)) {
    const i = S.byKey.get(id); if (!i) continue;
    const name = `${i.title} (${i.platform}, ${fmt(i.date, { month: "short", day: "numeric" })})`;
    if (o.resched) list.push(`${name}: moved to ${fmt(o.resched, { month: "short", day: "numeric" })}${o.posted ? ", then posted" : ""}`);
    else if (o.posted) list.push(`${name}: posted`);
  }
  return list;
}

/* ---------- Rendering ---------- */
function thumb(i, cls = "thumb") {
  if (!i.thumb) return `<div class="${cls} ph">${esc(i.platform)}</div>`;
  const src = String(i.thumb).replace(/^asset:/, "assets/");
  return `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls} ph',textContent:'${esc(i.platform)}'}))">`;
}
function dateLine(i) {
  const bits = [esc(i.format || "")];
  if (i.date !== S.today) bits.push(fmtDay(i.date));
  if (i.time) bits.push(esc(i.time));
  return bits.filter(Boolean).join(" · ");
}
function tags(i) {
  let h = "";
  if (i.local) h += `<span class="tag local">Phone only, not in Sheet yet</span>`;
  if (i.virtual) h += `<span class="tag">Moved from ${fmt(i.origDate, { month: "short", day: "numeric" })}</span>`;
  if (i.status === "rescheduled" && i.movedTo) h += `<span class="tag">Moved to ${fmt(i.movedTo, { month: "short", day: "numeric" })}</span>`;
  if (isOpen(i)) for (const g of prepGaps(i)) h += `<span class="tag">${g}</span>`;
  if (isOpen(i) && quietText(i)) h += `<span class="tag quiet">${quietText(i)}</span>`;
  return h ? `<div>${h}</div>` : "";
}

function fullCard(i) {
  const hasText = !!i.postText.trim();
  const open = isOpen(i);
  return `<article class="card${open ? "" : " done"}" data-key="${esc(i.key)}" ${open ? 'data-swipe="1"' : ""}>
    <div class="swipe-bg"><span class="l">${ICON.check} Posted</span><span class="r">Reschedule</span></div>
    <div class="fg">
      <div class="card-h">${chip(i.platform, i.status)}
        <div class="ttl"><div class="t1">${esc(i.title)}</div><div class="t2">${dateLine(i)} ${pill(i.status)}</div></div>
        ${thumb(i)}
      </div>
      ${hasText ? `<div class="txt clamp">${esc(i.postText)}</div><button class="more" data-act="sheet" data-key="${esc(i.key)}">Full post and media</button>`
                : `<div class="txt muted">${quietText(i) ? esc(quietText(i))+"." : "No post text yet."}</div><button class="more" data-act="sheet" data-key="${esc(i.key)}">Details</button>`}
      ${tags(i)}
      <div class="acts">
        <button class="btn primary" data-act="open" data-key="${esc(i.key)}" ${hasText ? "" : "disabled"}>${ICON.open} Copy, open ${esc(i.platform)}</button>
        <button class="btn sq" data-act="copy" data-key="${esc(i.key)}" ${hasText ? "" : "disabled"} aria-label="Copy text">${ICON.copy}</button>
        ${open ? `<button class="btn ok sq" data-act="posted" data-key="${esc(i.key)}" aria-label="Mark posted">${ICON.check}</button>`
               : i.local === "posted" ? `<button class="btn" data-act="unpost" data-key="${esc(i.key)}">Undo</button>` : ""}
      </div>
    </div>
  </article>`;
}
function rowHTML(i, extra = "") {
  return `<button class="row" data-act="sheet" data-key="${esc(i.key)}">${thumb(i)}
    <div class="rt"><div class="r1">${esc(i.title)}</div><div class="r2">${esc(extra || i.postText.trim() || prepGaps(i).join(", ") || quietText(i) || "No post text yet")}</div></div>
    ${chip(i.platform, i.status)}</button>`;
}

function renderToday() {
  const el = $("#v-today"), t = S.today;
  if (!S.raw) {
    el.innerHTML = S.expired ? signedOutBanner() : `<div class="empty">No data yet. Check your connection and tap refresh.</div>`;
    return;
  }
  let h = "";
  if (S.expired) h += signedOutBanner();
  if (S.offline) h += `<div class="banner warn">Offline. Showing the last saved copy.</div>`;
  if (S.genDate && S.genDate < t) h += `<div class="banner warn">This data is from ${fmtDay(S.genDate)}. Today's 8 AM update has not loaded yet.</div>`;
  if (S.raw.igPaused) h += `<div class="banner warn">Instagram is paused. Instagram posts are not counted as missed.</div>`;
  const pend = pendingChanges();
  if (pend.length) h += `<div class="banner">${pend.length} change${pend.length > 1 ? "s" : ""} not in the Sheet yet<button data-act="pending">Review</button></div>`;

  const missed = S.items.filter((i) => i.status === "missed");
  const soon = S.items.filter((i) => isOpen(i) && i.date > t && i.date <= addDays(t, 3) && prepGaps(i).length);
  if (missed.length || soon.length) {
    h += `<h2>Needs attention</h2>`;
    h += missed.map(fullCard).join("");
    if (soon.length) h += `<div class="note">Due in the next 3 days, not ready</div>` + soon.map((i) => rowHTML(i, fmtDay(i.date) + ": " + prepGaps(i).join(", "))).join("");
  }

  const todays = (S.byDate.get(t) || []).filter((i) => i.status !== "rescheduled");
  todays.sort((a, b) => Number(!isOpen(a)) - Number(!isOpen(b)));
  h += `<h2>Today, ${fmtDay(t)}</h2>`;
  h += todays.length ? todays.map(fullCard).join("") : `<div class="empty">Nothing scheduled today.</div>`;

  const next = S.items.find((i) => i.date > t && isOpen(i));
  if (next) {
    const nd = next.date, list = (S.byDate.get(nd) || []).filter(isOpen);
    h += `<h2>Next up, ${fmtDay(nd)}</h2>` + list.map((i) => rowHTML(i)).join("");
  }
  el.innerHTML = h;
}
const signedOutBanner = () => `<div class="banner bad">You are signed out.<button data-act="signin">Sign in</button></div>`;

function stripRange() {
  const dates = S.items.map((i) => i.date);
  let a = addDays(S.today, -14), b = addDays(S.today, 28);
  if (dates.length) { if (dates[0] < a) a = dates[0]; if (dates[dates.length - 1] > b) b = dates[dates.length - 1]; }
  return [a, b];
}
function buildStrip() {
  const [a, b] = stripRange();
  let h = "";
  for (let d = a; d <= b; d = addDays(d, 1)) {
    const list = S.byDate.get(d) || [];
    const shown = list.slice(0, 3), extra = list.length - shown.length;
    h += `<section class="day${d === S.today ? " is-today" : ""}" data-date="${d}">
      <h3>${fmtDay(d)}${d === S.today ? '<span class="tb">Today</span>' : ""}</h3>
      ${list.length ? shown.map((i) => rowHTML(i)).join("") : `<div class="nothing">Nothing scheduled</div>`}
      ${extra > 0 ? `<button class="smallbtn" data-act="daysheet" data-date="${d}">+${extra} more</button>` : ""}
    </section>`;
  }
  $("#strip").innerHTML = h;
  S.stripBuiltFor = S.today;
}
let programmatic = false;
function snappedDay() {
  const root = $("#strip");
  if (!root) return null;
  const cards = root.querySelectorAll(".day[data-date]");
  const left = root.getBoundingClientRect().left;
  let best = null, bestDist = Infinity;
  for (const el of cards) {
    const dist = Math.abs(el.getBoundingClientRect().left - left);
    if (dist < bestDist) { bestDist = dist; best = el; }
  }
  return best ? best.dataset.date : null;
}
function onStripScroll() {
  if (programmatic) return;
  const day = snappedDay();
  if (!day || day === S.selected) return;
  S.selected = day;
  updateCalendarChrome();
}
function scrollStripTo(date, smooth) {
  const el = document.querySelector(`#strip .day[data-date="${date}"]`);
  if (!el) return;
  const strip = $("#strip");
  programmatic = true;
  const left = el.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft - (strip.clientWidth - el.clientWidth) / 2;
  strip.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });
  clearTimeout(scrollStripTo.t);
  scrollStripTo.t = setTimeout(() => { programmatic = false; }, smooth ? 700 : 200);
  S.selected = date;
  updateCalendarChrome();
}
function updateCalendarChrome() {
  const sel = S.selected || S.today;
  const sun = weekStartOf(sel);
  if ($("#weeklbl")) $("#weeklbl").textContent = "Week of " + fmt(sun, { month: "short", day: "numeric" });
  if ($("#wk-today")) $("#wk-today").classList.toggle("hidden", sel === S.today);
  const mon = sel.slice(0, 7);
  if (S.month !== mon) S.month = mon;
  if (S.view === "calendar") renderMonth();
}

function renderMonth() {
  const focus = S.selected || S.today;
  const monthKey = S.month || focus.slice(0, 7);
  const [y, m] = monthKey.split("-").map(Number);
  const first = `${monthKey}-01`;
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const last = `${monthKey}-${String(dim).padStart(2, "0")}`;
  const gridStart = weekStartOf(first);
  const gridEnd = addDays(weekStartOf(last), 6);
  const weekA = weekStartOf(focus);
  const weekB = addDays(weekA, 6);
  if ($("#monthlbl")) $("#monthlbl").textContent = fmt(first, { month: "long", year: "numeric" });
  let h = ["S", "M", "T", "W", "T", "F", "S"].map((d) => `<div class="wd">${d}</div>`).join("");
  for (let d = gridStart; d <= gridEnd; d = addDays(d, 1)) {
    const list = S.byDate.get(d) || [];
    const inMonth = d >= first && d <= last;
    const cls = ["cell", d === S.today ? "today" : "", d === focus ? "focus" : "", (d >= weekA && d <= weekB) ? "in-week" : "", inMonth ? "" : "out", d < S.today ? "past" : ""].filter(Boolean).join(" ");
    const n = Number(d.slice(8, 10));
    const chips = list.slice(0, 3).map((i) => chip(i.platform, i.status)).join("");
    const label = `${fmtDay(d)}, ${list.length} post${list.length === 1 ? "" : "s"}`;
    h += `<button class="${cls}" data-act="day" data-date="${d}" aria-label="${label}"><span class="n">${n}</span>${chips}${list.length > 3 ? `<span class="plus">+${list.length - 3}</span>` : ""}</button>`;
  }
  if ($("#grid")) $("#grid").innerHTML = h;
}

async function prepareFiles(i, files) {
  const btn = () => document.getElementById("savebtn");
  try {
    if (!S.prepared[i.key]) {
      const out = [];
      for (const m of files) {
        const res = await fetch(m.file, { credentials: "same-origin" });
        if (!res.ok) throw new Error("fetch");
        const blob = await res.blob();
        const name = m.file.split("/").pop() || "file";
        out.push(new File([blob], name, { type: blob.type || "application/octet-stream" }));
      }
      S.prepared[i.key] = out;
    }
    const ok = navigator.canShare && navigator.canShare({ files: S.prepared[i.key] });
    if (sheetKey === i.key && btn()) {
      btn().disabled = !ok;
      btn().textContent = ok ? `Save ${files.length} file${files.length > 1 ? "s" : ""}` : "Sharing files not supported here";
    }
  } catch (e) {
    if (sheetKey === i.key && btn()) btn().textContent = "Could not load media";
  }
}

/* ---------- Playbook tab (X only) ----------
   Everything below reads playbook.json. Nothing about stats, rules, evidence,
   or effects is written into this page; a daily or weekly run edits the JSON
   and the tab follows. Charts and medians are worked out here at view time. */
const arr = (v) => (Array.isArray(v) ? v : []);
const numOrNull = (v) => (typeof v === "number" && isFinite(v) ? v : null);
const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const PB_METRICS = [
  ["impressions", "Views (impressions)"], ["likes", "Likes"], ["bookmarks", "Bookmarks"],
  ["reposts", "Reposts"], ["replies", "Replies"], ["quotes", "Quotes"], ["engagementRatePct", "Engagement rate"]
];
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

function humanize(k) {
  let s = String(k).replace(/([a-z])([A-Z0-9])/g, "$1 $2").replace(/([0-9])([A-Z])/g, "$1 $2").toLowerCase();
  s = s.replace(/\bcore em\b/g, "Core EM").replace(/\bapi\b/g, "API").replace(/^x\b/, "X").replace(/(\d) plus\b/g, "$1+")
       .replace(new RegExp("\\b(" + MONTHS.join("|") + ")\\b", "g"), (m) => m[0].toUpperCase() + m.slice(1));
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const metricLabel = (k) => (PB_METRICS.find((m) => m[0] === k) || [k, humanize(k)])[1];
function fmtNum(v, digits = 1) {
  const x = numOrNull(v);
  return x === null ? null : x.toLocaleString("en-US", { maximumFractionDigits: digits });
}
const fmtMetric = (k, v) => {
  // Counts of 100 or more show as whole numbers; a median like 1,825.5 views reads as 1,826.
  const s = fmtNum(v, k === "engagementRatePct" ? 3 : Math.abs(numOrNull(v) ?? 0) >= 100 ? 0 : 1);
  return s === null ? null : k === "engagementRatePct" ? s + "%" : s;
};
const hostOf = (u) => { try { return new URL(u).hostname; } catch (e) { return "web"; } };
const safeUrl = (u) => (/^https:\/\//i.test(String(u || "")) ? String(u) : null);
function median(list) {
  const v = list.map(numOrNull).filter((x) => x !== null).sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

/* Reads "2026-11-19 2:31 PM ET" and "Thursday, November 26, 2026, 10:34 AM ET". */
function parseET(s) {
  if (!s) return null;
  s = String(s);
  let date = null, m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) date = `${m[1]}-${m[2]}-${m[3]}`;
  else {
    m = s.match(/([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})/);
    const mi = m ? MONTHS.indexOf(m[1].toLowerCase()) : -1;
    if (mi >= 0) date = `${m[3]}-${String(mi + 1).padStart(2, "0")}-${String(m[2]).padStart(2, "0")}`;
  }
  if (!date) return null;
  const tm = s.match(/(\d{1,2}):(\d{2})\s*([AP])\.?M/i);
  let mins = 0, time = null;
  if (tm) {
    let h = Number(tm[1]) % 12; if (/p/i.test(tm[3])) h += 12;
    mins = h * 60 + Number(tm[2]);
    time = `${Number(tm[1])}:${tm[2]} ${tm[3].toUpperCase()}M`;
  }
  return { date, time, t: toUTC(date) + mins * 6e4 };
}
function pbAsOf(pb) {
  if (pb.asOfIso && !isNaN(Date.parse(pb.asOfIso))) {
    const g = new Date(pb.asOfIso);
    return {
      date: new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(g),
      time: g.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" })
    };
  }
  return parseET(pb.asOf);
}
function pbStampText(pb) {
  const a = pbAsOf(pb);
  if (!a) return "As of time unknown";
  return "As of " + (a.date !== S.today ? fmt(a.date, { month: "short", day: "numeric" }) + ", " : "") + (a.time ? a.time + " ET" : "");
}
const longDate = (d) => (isDate(d) ? fmt(d, { month: "short", day: "numeric", year: "numeric" }) : "date not recorded");
const shortDate = (d) => (isDate(d) ? fmt(d, { month: "short", day: "numeric" }) : "date not recorded");
const daysBetween = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
const whenText = (s) => { const p = parseET(s); return p ? fmt(p.date, { month: "short", day: "numeric" }) + (p.time ? ", " + p.time + " ET" : "") : String(s || ""); };

/* Sparkline. Dots are zero-length round-capped strokes so they stay round when the SVG stretches. */
function spark(points, label) {
  const pts = points.filter((p) => numOrNull(p.y) !== null && numOrNull(p.x) !== null);
  if (pts.length < 2) return "";
  const W = 100, H = 40, pad = 4;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = (x) => (x1 === x0 ? W / 2 : pad + ((x - x0) / (x1 - x0)) * (W - 2 * pad));
  const Y = (y) => (y1 === y0 ? H / 2 : H - pad - ((y - y0) / (y1 - y0)) * (H - 2 * pad));
  const line = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(2) + " " + Y(p.y).toFixed(2)).join(" ");
  const dots = pts.map((p, i) => `<path d="M${X(p.x).toFixed(2)} ${Y(p.y).toFixed(2)}h0.01" stroke-width="${i === pts.length - 1 ? 7 : 4.5}"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="${line}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      ${dots.replace(/<path /g, '<path vector-effect="non-scaling-stroke" ')}
    </g></svg>`;
}

/* One place to look up a post by id. recentPosts first: it is the newest pull. */
function pbPosts(pb) {
  const out = [...arr(pb.recentPosts), ...arr(pb.topPosts)];
  for (const e of arr(pb.observedEffects)) {
    if (e && e.baseline) out.push(...arr(e.baseline.posts));
    if (e && e.after) out.push(...arr(e.after.posts));
  }
  return out;
}
const pbPostById = (pb, id) => pbPosts(pb).find((p) => p && String(p.id) === String(id));

function metricsLine(p, keys = ["likes", "impressions", "bookmarks", "reposts", "replies"]) {
  const short = { impressions: "views", likes: "likes", bookmarks: "bookmarks", reposts: "reposts", replies: "replies", quotes: "quotes" };
  const word = (k) => { const w = short[k] || metricLabel(k).toLowerCase(); return p[k] === 1 ? w.replace(/ies$/, "y").replace(/s$/, "") : w; };
  let h = keys.map((k) => { const v = fmtMetric(k, p[k]); return v === null ? "" : `<span><b>${esc(v)}</b> ${esc(word(k))}</span>`; }).join("");
  if (numOrNull(p.videoViews) !== null) h += `<span class="vv">${esc(fmtNum(p.videoViews))} video view${p.videoViews === 1 ? "" : "s"}</span>`;
  return `<div class="metrics">${h}</div>`;
}
function postMeta(p) {
  const w = parseET(p.createdAtET);
  return [w ? fmtDay(w.date) + (w.time ? ", " + w.time : "") : "", p.format || ""].filter(Boolean).map(esc).join(" · ");
}
const postRow = (p) => `<button class="prow" data-act="pbpost" data-id="${esc(p.id)}"><div class="r1">${esc(p.title || p.firstLine || "Post")}</div><div class="r2">${postMeta(p)}</div>${metricsLine(p)}</button>`;

/* Remembered open or closed state for panels. Defaults apply until the user taps. */
const isOpenPanel = (id, dflt) => (S.pbOpen.has(id) ? S.pbOpen.get(id) : dflt);
function panel(id, summaryHTML, bodyHTML, dflt = false, cls = "box") {
  return `<details class="${cls}" data-pid="${esc(id)}"${isOpenPanel(id, dflt) ? " open" : ""}><summary><span class="sm">${summaryHTML}</span>${CHEV}</summary><div class="body">${bodyHTML}</div></details>`;
}

/* 1. Account stats */
function pbStats(pb) {
  const a = pb.account || {}, notes = pb.metricsNotes || {};
  const handle = a.handle ? "@" + String(a.handle).replace(/^@/, "") : "Account";
  let h = `<div class="box"><h3>${esc(handle)} on X</h3><div class="asof">${esc(pb.asOf ? "As of " + String(pb.asOf).replace(/^As of /i, "") : pbStampText(pb))}</div>`;

  const trend = arr(pb.followerTrend).map((r) => ({ ...r, p: parseET(r.asOf) }))
    .filter((r) => r.p && numOrNull(r.followers) !== null).sort((x, y) => x.p.t - y.p.t);
  const cur = numOrNull(a.followers) ?? (trend.length ? trend[trend.length - 1].followers : null);
  let delta = "";
  if (trend.length >= 2) {
    const d = trend[trend.length - 1].followers - trend[0].followers;
    delta = `${d > 0 ? "+" : ""}${d.toLocaleString("en-US")} since ${shortDate(trend[0].p.date)}`;
  }
  h += `<div class="big">${cur === null ? "Not in this pull" : esc(fmtNum(cur))}<span class="delta">${esc(delta)}</span></div><div class="asof">Followers</div>`;
  if (trend.length >= 2) {
    const ys = trend.map((r) => r.followers);
    h += spark(trend.map((r) => ({ x: r.p.t, y: r.followers })), "Followers: " + trend.map((r) => `${shortDate(r.p.date)} ${r.followers}`).join(", "));
    h += `<div class="sparkax"><span>${shortDate(trend[0].p.date)}</span><span>Range ${esc(fmtNum(Math.min(...ys)))} to ${esc(fmtNum(Math.max(...ys)))}</span><span>${shortDate(trend[trend.length - 1].p.date)}</span></div>`;
  } else {
    h += `<div class="note">Follower trend needs at least two readings. ${trend.length ? "Only one so far." : "None yet."}</div>`;
  }
  const kv = [["following", "Following"], ["tweetCount", "Posts"], ["listedCount", "Lists"], ["mediaCount", "Media"]]
    .filter(([k]) => numOrNull(a[k]) !== null);
  if (kv.length) h += `<div class="kv">${kv.map(([k, l]) => `<div><b>${esc(fmtNum(a[k]))}</b><span>${l}</span></div>`).join("")}</div>`;
  if (trend.length) {
    h += panel("followers-readings", "Follower readings", `<ul class="blist">${trend.slice().reverse().map((r) =>
      `<li><b>${esc(fmtNum(r.followers))}</b> on ${esc(whenText(r.asOf))}<div class="note">${esc(r.source || "")}</div></li>`).join("")}</ul>`, false, "inner");
  }
  h += `</div>`;

  // Per-post trends, oldest to newest
  const posts = arr(pb.recentPosts).map((p) => ({ ...p, w: parseET(p.createdAtET) })).filter((p) => p.w).sort((x, y) => x.w.t - y.w.t);
  h += `<h2>Recent posts</h2>`;
  if (!posts.length) h += `<div class="empty">No recent posts in this pull yet.</div>`;
  else {
    h += `<div class="note">Median per post across the ${posts.length} most recent original posts in this pull, ${shortDate(posts[0].w.date)} to ${shortDate(posts[posts.length - 1].w.date)}. Lines run oldest to newest, one dot per post.</div>`;
    h += `<div class="tiles">` + ["likes", "impressions", "bookmarks", "reposts", "replies", "engagementRatePct"].map((k) => {
      const vals = posts.map((p) => numOrNull(p[k]));
      if (vals.every((v) => v === null)) return "";
      const med = median(vals), last = posts[posts.length - 1];
      return `<div class="tile"><div class="lb">${esc(metricLabel(k))}</div><div class="v">${esc(fmtMetric(k, med) ?? "not given")}</div><div class="sub">median per post</div>
        ${spark(posts.map((p, i) => ({ x: i, y: p[k] })), metricLabel(k) + " per post, oldest to newest: " + vals.map((v) => (v === null ? "none" : v)).join(", "))}
        <div class="sub">Latest: ${esc(fmtMetric(k, last[k]) ?? "not given")}</div></div>`;
    }).join("") + `</div>`;
    h += posts.slice().reverse().map(postRow).join("");
    if (posts.some((p) => numOrNull(p.videoViews) !== null)) h += `<div class="note">Video views are plays of a native video. They are a different count from views (impressions) and are only shown where X gives them.</div>`;
    if (notes.engagementRateDefinition) h += `<div class="note">${esc(notes.engagementRateDefinition)}</div>`;
  }

  // Top posts
  const top = arr(pb.topPosts).slice().sort((x, y) => (numOrNull(x.rank) ?? 99) - (numOrNull(y.rank) ?? 99));
  h += `<h2>Top ${top.length || ""} posts</h2>`;
  if (!top.length) h += `<div class="empty">No top posts picked in this pull yet.</div>`;
  else {
    h += `<div class="box">` + top.map((p, i) => {
      const u = safeUrl(p.url);
      return `<div class="top3"><div class="rank">${esc(p.rank ?? i + 1)}</div><div class="tt">
        <button class="prow" style="padding:0;background:none;margin:0" data-act="pbpost" data-id="${esc(p.id)}"><div class="r1">${esc(p.title || p.firstLine || "Post")}</div><div class="r2">${postMeta(p)}</div>${metricsLine(p)}</button>
        ${u ? `<a class="xlink" href="${esc(u)}" target="_blank" rel="noopener">Open post on X</a>` : `<div class="note">No link in the data.</div>`}</div></div>`;

/* 2 to 4. Rules */
function pbAllRules(pb) { return [...arr(pb.currentRules), ...arr(pb.priorRules), ...arr(pb.proposedRules)].filter((r) => r && typeof r === "object"); }
const byDateDesc = (key) => (x, y) => {
  const a = isDate(x[key]) ? x[key] : "", b = isDate(y[key]) ? y[key] : "";
  return a === b ? x._i - y._i : a < b ? 1 : -1;
};
const indexed = (list) => arr(list).filter((r) => r && typeof r === "object").map((r, i) => ({ ...r, _i: i }));

function ruleCard(r, pb, kind) {
  const all = pbAllRules(pb);
  const id = "rule-" + (r.id || kind + r._i);
  const open = isOpenPanel(id, false);
  let meta = "";
  if (kind === "current") {
    meta = `<span class="dtag">Adopted ${esc(longDate(r.adopted))}</span>`;
  } else if (kind === "prior") {
    const by = all.find((x) => x.id && x.id === r.replacedBy);
    meta = `<span class="dtag">Replaced ${esc(longDate(r.replacedOn))}</span><span class="dtag">Adopted ${esc(longDate(r.adopted))}</span>`;
    if (r.replacedBy) meta += `<span>By: ${esc(by ? by.title : r.replacedBy)}${by && by.status === "prior" ? " (since replaced too)" : ""}</span>`;
  } else {
    meta = `<span class="ptag">Proposed, not adopted</span><span class="dtag">Proposed ${esc(longDate(r.proposedOn))}</span>`;
  }
  const replaced = r.id ? all.filter((x) => x.replacedBy === r.id) : [];
  const repl = replaced.length ? `<div class="meta">Replaced: ${replaced.map((x) => esc(x.title)).join("; ")}</div>` : "";
  let h = `<div class="box rule${kind === "proposed" ? " proposed" : ""}${open ? " open" : ""}">
    <div class="tap" data-act="pbtoggle" data-pid="${esc(id)}" role="button" tabindex="0" aria-expanded="${open}">
      <h3>${esc(r.title || "Untitled rule")}</h3>
      <div class="meta">${meta}</div>${repl}
      ${r.detail ? `<div class="rd">${esc(r.detail)}</div>` : ""}
      <div class="src">Source: ${esc(r.source || "not recorded")}</div>
      <div class="more2">${open ? "Show less" : "Show more"}</div>
    </div>`;
  const items = arr(r.items);
  if (items.length) {
    const body = items.map((it) => {
      const extra = Object.entries(it).filter(([k, v]) => !["date", "title", "hook"].includes(k) && (typeof v === "string" || typeof v === "number"));
      return `<div class="hook"><div class="hd">${isDate(it.date) ? esc(fmtDay(it.date) + ", " + fmt(it.date, { year: "numeric" })) : esc(it.date || "No date")} · ${esc(it.title || "")}</div>
        ${it.hook ? `<div class="hq">"${esc(it.hook)}"</div>` : ""}${extra.map(([k, v]) => `<div class="note">${esc(humanize(k))}: ${esc(v)}</div>`).join("")}</div>`;
    }).join("");
    h += panel(id + "-items", `Show ${items.length} ${items.some((it) => it.hook) ? "held first lines" : "items"}`, body, false, "inner");
  }
  return h + `</div>`;
}
function pbRules(pb, kind) {
  const list = kind === "current" ? indexed(pb.currentRules).sort(byDateDesc("adopted"))
    : kind === "prior" ? indexed(pb.priorRules).sort(byDateDesc("replacedOn"))
    : indexed(pb.proposedRules).sort(byDateDesc("proposedOn"));
  const intro = {
    current: "What the bots and drafts follow now. Newest first. Tap a rule for the full text and source.",
    prior: "Rules that were in use and then replaced. Newest change first.",
    proposed: "Ideas on the table. None of these are in force until Julian approves them."
  }[kind];
  if (!list.length) return `<div class="empty">None ${kind === "proposed" ? "proposed" : "recorded"} yet.</div>`;
  return `<div class="note">${intro}</div>` + list.map((r) => ruleCard(r, pb, kind)).join("");
}

/* 5. Evidence log, newest first */
function pbEvidence(pb) {
  const list = indexed(pb.evidence).reverse().map((e, i) => ({ ...e, _i: i })).sort(byDateDesc("logged"));
  if (!list.length) return `<div class="empty">No evidence logged yet.</div>`;
  return list.map((e, n) => {
    const s = e.sample && typeof e.sample === "object" ? Object.entries(e.sample) : [];
    const nums = s.filter(([, v]) => typeof v === "number"), strs = s.filter(([, v]) => typeof v === "string");
    let b = e.headline ? `<div class="lead">${esc(e.headline)}</div>` : "";
    if (e.loggedAt) b += `<div class="asof" style="margin-top:6px">Logged ${esc(e.loggedAt)}</div>`;
    if (s.length) {

      b += strs.map(([k, v]) => `<div class="kvline"><span>${esc(humanize(k))}:</span> ${esc(v)}</div>`).join("");
    }

        `<div class="find"><div class="fh">${esc((x.n ?? i + 1) + ". " + (x.finding || ""))}</div>${x.numbers ? `<div class="fnum">${esc(x.numbers)}</div>` : ""}${x.strength ? `<span class="dtag">Strength: ${esc(x.strength)}</span>` : ""}</div>`).join("");

    return panel("ev-" + (e.id || e._i), `<span class="dtag">${esc(longDate(e.logged))}</span><div style="margin-top:4px">${esc(e.title || "Untitled entry")}</div>`, b, n === 0);

/* 6. Observed effects of deliberate changes, newest start first */
function statusClass(s) {
  s = String(s || "").toLowerCase();
  if (/progress|running|active|ongoing/.test(s)) return "st-active";
  if (/done|complete|ended|finished/.test(s)) return "st-done";
  if (/stop|cancel|abandon|fail/.test(s)) return "st-stopped";
  return "st-other";
}
function changeText(k, after, base) {
  const a = numOrNull(after), b = numOrNull(base);
  if (a === null || b === null) return "";
  if (k === "engagementRatePct") { const d = a - b; return `${d >= 0 ? "+" : ""}${d.toFixed(2)} pts`; }
  if (b === 0) return a === 0 ? "no change" : "";
  const pct = ((a - b) / b) * 100;
  return `${pct >= 0 ? "+" : ""}${pct.toFixed(0)}%`;
}
function pbEffects(pb) {
  const list = indexed(pb.observedEffects).reverse().map((e, i) => ({ ...e, _i: i })).sort(byDateDesc("startDate"));
  if (!list.length) return `<div class="empty">No deliberate changes logged yet.</div>`;
  return list.map((e) => {
    let h = `<div class="box"><h3>${esc(e.change || "Untitled change")}</h3>
      <div class="meta" style="font-size:13px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
      ${e.status ? `<span class="pill ${statusClass(e.status)}">${esc(e.status)}</span>` : ""}
      <span class="dtag">Started ${esc(longDate(e.startDate))}</span>
      ${e.endDatePlanned ? `<span class="dtag">Planned end ${esc(longDate(e.endDatePlanned))}</span>` : ""}</div>`;
    if (isDate(e.startDate) && isDate(e.endDatePlanned)) {
      const total = daysBetween(e.startDate, e.endDatePlanned), done = daysBetween(e.startDate, S.today);
      const pct = total > 0 ? Math.max(0, Math.min(100, (done / total) * 100)) : 0;
      const txt = done < 0 ? `Starts in ${-done} day${done === -1 ? "" : "s"}.`
        : done >= total ? `Planned end reached on ${fmtDay(e.endDatePlanned)}.`
        : `Day ${done + 1}. Planned end ${fmtDay(e.endDatePlanned)}, in ${total - done} day${total - done === 1 ? "" : "s"}.`;
      h += `<div class="bar" aria-hidden="true"><i style="width:${pct.toFixed(1)}%"></i></div><div class="note" style="margin:0">${esc(txt)} This counts calendar days, not posts.</div>`;
    }
    h += `<div class="sub-h">Results</div><div style="font-size:15px">${esc(e.results || (e.after ? "See the After column." : "Not yet."))}</div>`;
    if (e.note) h += `<div class="note" style="margin-top:8px">${esc(e.note)}</div>`;

    const base = e.baseline || null, after = e.after || null;
    if (base || after) {
      const fz = base && base.frozenMedians || {}, lv = base && base.liveMedians || {}, am = after && after.medians || {};
      const keys = [...new Set([...PB_METRICS.map((m) => m[0]), ...Object.keys(fz), ...Object.keys(lv), ...Object.keys(am)])]
        .filter((k) => k in fz || k in lv || k in am);
      const fzD = base && parseET(base.frozenAt), lvD = base && parseET(base.liveRefreshAt), afD = after && parseET(after.measuredAt);
      const cell = (k, o) => { const v = fmtMetric(k, o[k]); return v === null ? `<td class="na">none</td>` : `<td>${esc(v)}</td>`; };
      h += `<div class="sub-h">Before and after</div>`;
      if (base && base.label) h += `<div style="font-size:14px">Baseline: ${esc(base.label)}</div>`;
      h += `<table class="cmp"><thead><tr><th>Median per post</th>
          <th>Baseline<br>${fzD ? esc(shortDate(fzD.date)) : "frozen"}</th>
          ${Object.keys(lv).length ? `<th>Re-read<br>${lvD ? esc(shortDate(lvD.date)) : "later"}</th>` : ""}
          <th>After${afD ? "<br>" + esc(shortDate(afD.date)) : ""}</th></tr></thead><tbody>` +
        keys.map((k) => `<tr><td>${esc(metricLabel(k))}</td>${cell(k, fz)}${Object.keys(lv).length ? cell(k, lv) : ""}${after
          ? (fmtMetric(k, am[k]) === null ? `<td class="na">none</td>` : `<td>${esc(fmtMetric(k, am[k]))}<span class="chg">${esc(changeText(k, am[k], k in fz ? fz[k] : lv[k]))}</span></td>`)
          : `<td class="na">not yet</td>`}</tr>`).join("") + `</tbody></table>`;
      let notes = "";
      if (base && base.frozenAt) notes += `Baseline frozen ${esc(base.frozenAt)}${base.frozenSource ? " from " + esc(base.frozenSource) : ""}. `;
      if (base && base.liveRefreshAt) notes += `Re-read ${esc(base.liveRefreshAt)}${base.liveRefreshSource ? ": " + esc(base.liveRefreshSource) : ""}. `;
      if (after) notes += `After: ${esc(after.label || "")}${after.measuredAt ? ", measured " + esc(after.measuredAt) : ""}${after.source ? ", from " + esc(after.source) : ""}. Change is against the frozen baseline.`;
      else notes += `After numbers come once enough posts have gone out under the change.`;
      h += `<div class="note">${notes}</div>`;
      if (after && after.summary) h += `<div style="font-size:15px;margin-top:6px">${esc(after.summary)}</div>`;
      const bp = arr(base && base.posts), ap = arr(after && after.posts);
      if (bp.length) h += panel((e.id || "fx" + e._i) + "-base", `Baseline posts (${bp.length})`, bp.map(postRow).join(""), false, "inner");
      if (ap.length) h += panel((e.id || "fx" + e._i) + "-after", `After posts (${ap.length})`, ap.map(postRow).join(""), false, "inner");
    }
    return h + `</div>`;
  }).join("");
}

const PB_SECTIONS = [
  ["stats", "Stats", null], ["current", "Current", "currentRules"], ["prior", "Prior", "priorRules"],
  ["proposed", "Proposed", "proposedRules"], ["evidence", "Evidence", "evidence"], ["effects", "Effects", "observedEffects"]
];
function renderPlaybook() {

/* Highlight the section chip for the part of the page in view. */
function pbSpy() {
  if (S.view !== "playbook" || Date.now() < (S.pbJumpUntil || 0)) return;
  const bar = $("#pbjump"); if (!bar) return;
  const line = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--top-h")) || 57) + bar.offsetHeight + 8;
  let cur = "pb-stats";
  for (const [id] of PB_SECTIONS) { const s = document.getElementById("pb-" + id); if (s && s.getBoundingClientRect().top <= line + 4) cur = "pb-" + id; }
  const sc = scroller();
  if (sc.scrollHeight > sc.clientHeight + 4 && sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4) cur = "pb-effects";
  bar.querySelectorAll("button").forEach((b) => {
    const on = b.dataset.target === cur;
    if (on && !b.classList.contains("on")) {
      const l = b.offsetLeft - 16, r = b.offsetLeft + b.offsetWidth + 16;
      if (l < bar.scrollLeft) bar.scrollTo({ left: l, behavior: "smooth" });
      else if (r > bar.scrollLeft + bar.clientWidth) bar.scrollTo({ left: r - bar.clientWidth, behavior: "smooth" });
    }
    b.classList.toggle("on", on);
  });
}
/* html and body both hide x overflow, so body (not the window) is what scrolls.
   Capture-phase listening on document hears scrolls from either one. */
function scroller() {
  const b = document.body;
  return b.scrollHeight > b.clientHeight + 1 ? b : (document.scrollingElement || document.documentElement);
}
let spyQueued = false;
document.addEventListener("scroll", (ev) => {
  if (S.view !== "playbook" || spyQueued) return;
  if (ev.target !== document && ev.target !== document.body && ev.target !== document.documentElement) return;
  spyQueued = true;
  requestAnimationFrame(() => { spyQueued = false; pbSpy(); });
}, { passive: true, capture: true });
function setTopH() { document.documentElement.style.setProperty("--top-h", $(".top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
setTopH();

/* ---------- Actions ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove(); return ok;
  }
}
function setOverride(baseId, next, msg) {
  const prev = S.overrides[baseId] ? { ...S.overrides[baseId] } : null;
  if (next) S.overrides[baseId] = { ...next, at: new Date().toISOString() }; else delete S.overrides[baseId];
  saveOv(); derive(); render();
  toast(msg, () => { if (prev) S.overrides[baseId] = prev; else delete S.overrides[baseId]; saveOv(); derive(); render(); });
}
function markPosted(i) {
  const cur = S.overrides[i.baseId] || {};
  setOverride(i.baseId, { ...cur, posted: true }, `Marked posted: ${i.title}`);
}
function unpost(i) {
  const cur = { ...(S.overrides[i.baseId] || {}) };
  if (cur.posted) delete cur.posted; else delete cur.resched;
  setOverride(i.baseId, cur.posted || cur.resched ? cur : null, "Phone change undone");
}
function reschedule(i, date) {
  if (!isDate(date)) return;
  closeSheet();
  if (date === i.date) return;
  const original = S.raw.posts.find((p) => pid(p) === i.baseId);
  if (original && date === original.date) setOverride(i.baseId, null, `Back on ${fmtDay(date)}`);
  else setOverride(i.baseId, { resched: date }, `Moved to ${fmtDay(date)}`);
}

let toastTimer = null, undoFn = null;
function toast(msg, undo) {
  $("#toast-msg").textContent = msg;
  undoFn = undo || null;
  $("#toast-undo").classList.toggle("hidden", !undo);
  $("#toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toast").classList.remove("on"); undoFn = null; }, undo ? 6000 : 2200);
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act],[data-tab]");
  if (!el) return;
  if (el.dataset.tab) { setView(el.dataset.tab); return; }
  const act = el.dataset.act, i = el.dataset.key ? S.byKey.get(el.dataset.key) : null;
  switch (act) {
    case "sheet": if (i) postSheet(i); break;
    case "copy": if (i && (await copyText(i.postText))) toast("Copied with line breaks"); break;
    case "open":
      if (!i) break;
      if (await copyText(i.postText)) toast("Copied. Opening " + (PLATFORM_NAME[i.platform] || i.platform));
      if (OPEN_APP[i.platform]) setTimeout(() => { location.href = OPEN_APP[i.platform](i.postText); }, 150);
      break;
    case "posted": if (i) { markPosted(i); if (sheetKey) closeSheet(); } break;
    case "unpost": if (i) { unpost(i); if (sheetKey) closeSheet(); } break;
    case "resched": if (i) reschedSheet(i); break;
    case "pickdate": $("#rdate").value = el.dataset.date; break;
    case "doresched": if (i) reschedule(i, $("#rdate").value); break;
    case "save":
      if (i && S.prepared[i.key]) {
        try { await navigator.share({ files: S.prepared[i.key] }); } catch (e) { if (e.name !== "AbortError") toast("Could not open the share sheet"); }
      }
      break;
    case "pending": pendingSheet(); break;
    case "copylist": if (await copyText(pendingChanges().join("\n"))) toast("List copied"); break;
    case "day":
      S.selected = el.dataset.date;
      S.month = S.selected.slice(0, 7);
      if (S.view !== "calendar") setView("calendar");
      else { renderMonth(); scrollStripTo(S.selected, true); }
      break;
    case "daysheet": daySheet(el.dataset.date); break;
    case "pbpost": pbPostSheet(el.dataset.id); break;
    case "pbtoggle": pbToggleRule(el); break;
    case "pbjump": {
      const t = document.getElementById(el.dataset.target);
      if (!t) break;
      S.pbJumpUntil = Date.now() + 1200;
      el.parentNode.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el));
      t.scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(pbSpy, 1250);
      break;
    }
    case "signin": location.reload(); break;
    case "close": closeSheet(); break;
  }
});
$("#backdrop").addEventListener("click", closeSheet);
$("#refresh").addEventListener("click", load);
$("#help").addEventListener("click", keySheet);
$("#toast-undo").addEventListener("click", () => { const f = undoFn; undoFn = null; $("#toast").classList.remove("on"); if (f) f(); });
$("#wk-today").addEventListener("click", () => scrollStripTo(S.today, true));
$("#m-prev").addEventListener("click", () => jumpMonth(-1));
$("#m-next").addEventListener("click", () => jumpMonth(1));
function jumpMonth(delta) {
  const [y, m] = S.month.split("-").map(Number);
  S.month = fromUTC(Date.UTC(y, m - 1 + delta, 1)).slice(0, 7);
  S.selected = (S.today.slice(0, 7) === S.month) ? S.today : (S.month + "-01");
  if (S.stripBuiltFor !== S.today) buildStrip();
  renderMonth();
  scrollStripTo(S.selected, true);
}
$("#strip").addEventListener("scroll", onStripScroll, { passive: true });

/* Swipe-down on the sheet's grab bar closes it */
(() => {
  let y0 = null;
  const sheet = $("#sheet");
  sheet.addEventListener("touchstart", (e) => { if (sheet.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener("touchend", (e) => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, { passive: true });
})();

/* ---------- Swipe actions on Today cards ---------- */
(() => {
  const TH = 90;
  let fg = null, card = null, x0 = 0, y0 = 0, dx = 0, mode = null;
  const root = $("#v-today");
  root.addEventListener("pointerdown", (e) => {
    const c = e.target.closest(".card[data-swipe]");
    if (!c || e.target.closest("button,a") || e.pointerType === "mouse" && e.button !== 0) return;
    card = c; fg = c.querySelector(".fg"); x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null;
  });
  root.addEventListener("pointermove", (e) => {
    if (!fg) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!mode) {
      if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
      mode = Math.abs(ddx) > Math.abs(ddy) ? "h" : "v";
      if (mode === "h") { fg.classList.add("dragging"); try { fg.setPointerCapture(e.pointerId); } catch (_) {} }
    }
    if (mode !== "h") return;
    dx = ddx;
    fg.style.transform = `translateX(${dx}px)`;
    card.classList.toggle("go-r", dx > 0); card.classList.toggle("go-l", dx < 0);
  });
  const end = () => {
    if (!fg) return;
    const i = S.byKey.get(card.dataset.key), d = dx, f = fg, c = card;
    f.classList.remove("dragging");
    f.style.transform = "";
    setTimeout(() => c.classList.remove("go-r", "go-l"), 200);
    fg = card = null;
    if (mode === "h" && i) {
      if (d > TH) markPosted(i);
      else if (d < -TH) reschedSheet(i);
    }
    mode = null;
  };
  root.addEventListener("pointerup", end);
  root.addEventListener("pointercancel", end);
})();

/* ---------- Lifecycle ---------- */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const dayChanged = todayET() !== S.today;
  if (dayChanged || Date.now() - S.loadedAt > 30 * 60 * 1000) load();
});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
load();
</script>
