/* ---------- Actions ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove(); return ok;
  }
}
const clone = (v) => (v ? JSON.parse(JSON.stringify(v)) : null);
/* Status changes (posted, moved). A text edit on the same post is always kept. */
function setOverride(baseId, next, msg) {
  const prev = clone(S.overrides[baseId]);
  const edit = prev && prev.edit;
  if (next) {
    const n = { ...next, at: new Date().toISOString() };
    delete n.edit;
    if (edit) n.edit = edit;
    S.overrides[baseId] = n;
  } else if (edit) S.overrides[baseId] = { edit };
  else delete S.overrides[baseId];
  saveOv(); derive(); render();
  toast(msg, () => { if (prev) S.overrides[baseId] = prev; else delete S.overrides[baseId]; saveOv(); derive(); render(); });
}
/* Text edits. Only the "edit" part changes; posted and moved marks, and their dates, stay as they are. */
function setEdit(baseId, edit, msg) {
  const prev = clone(S.overrides[baseId]);
  const o = { ...(S.overrides[baseId] || {}) };
  if (edit) o.edit = edit; else delete o.edit;
  if (o.posted || o.resched || o.edit) S.overrides[baseId] = o; else delete S.overrides[baseId];
  const redo = () => { saveOv(); derive(); render(); refreshSheet(); };
  redo();
  if (msg) toast(msg, () => { if (prev) S.overrides[baseId] = prev; else delete S.overrides[baseId]; redo(); });
}
const sheetTextOf = (baseId) => {
  const p = S.raw && S.raw.posts.find((q) => pid(q) === baseId);
  return p ? p.postText || "" : "";
};
function revertEdit(i) {
  setEdit(i.baseId, null, "Back to the Sheet text");
}
function keepEdit(i) {
  // Accept the new Sheet text as the new "original" so the warning clears. The edit text stays.
  const e = S.overrides[i.baseId] && S.overrides[i.baseId].edit;
  if (!e) return;
  setEdit(i.baseId, { ...e, base: sheetTextOf(i.baseId), sentAt: null }, "Kept your edit");
}

/* ---------- Text checks for the editor ---------- */
const EM_DASH = /\u2014/g;
let EMOJI = null;
try { EMOJI = new RegExp("\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F|\\u20E3", "gu"); } catch (e) { EMOJI = null; }
const findAll = (re, s) => { if (!re) return []; re.lastIndex = 0; return Array.from(String(s).matchAll(re), (m) => ({ i: m.index, n: m[0].length })); };
function countLine(platform, text) {
  if (platform === "X") {
    const n = xLength(text);
    return { label: `${n} / ${X_LIMIT}`, over: n > X_LIMIT ? n - X_LIMIT : 0, unit: "X" };
  }
  if (platform === "IG") {
    const n = Array.from(String(text)).length;
    return { label: `${n.toLocaleString("en-US")} / ${IG_LIMIT.toLocaleString("en-US")}`, over: n > IG_LIMIT ? n - IG_LIMIT : 0, unit: "Instagram" };
  }
  return { label: `${Array.from(String(text)).length} characters`, over: 0, unit: "" };
}

/* ---------- EM Bot hand-off ----------
   No secrets in this site, so the app cannot write to the Sheet. It builds a labeled block
   for Julian to paste in his chat with EM Bot. The markers let the bot take the text exactly. */
function botBlock(i) {
  const e = i.edit, c = countLine(i.platform, e.text);
  const lines = [
    "EM BOT: POST TEXT EDIT (from the posting calendar app)",
    "Post ID: " + i.baseId,
    "Post: " + i.title,
    "Platform: " + (PLATFORM_NAME[i.platform] || i.platform),
    "Date: " + (i.virtual ? i.origDate + " (moved on phone to " + i.date + ")" : i.date),
    "Edited: " + fmtWhen(e.at),
    "Sheet text changed since this edit: " + (normText(e.base) === normText(sheetTextOf(i.baseId)) ? "no" : "yes")
  ];
  if (c.unit === "X") lines.push("X count: " + c.label + (c.over ? " (over the limit)" : ""));
  lines.push("Please replace this post's text in the Sheet with the text between the markers, exactly as written, line breaks included. Approval and posting status stay as they are.");
  lines.push("=== EDITED TEXT START ===", e.text, "=== EDITED TEXT END ===");
  return lines.join("\n");
}
function markSent(items) {
  const now = new Date().toISOString();
  for (const i of items) { const o = S.overrides[i.baseId]; if (o && o.edit) o.edit.sentAt = now; }
  saveOv(); derive(); render(); refreshSheet();
}
async function sendToBot(items, viaShare) {
  items = items.filter((i) => i && i.edit);
  if (!items.length) return;
  const text = items.map(botBlock).join("\n\n");
  if (viaShare && navigator.share) {
    try { await navigator.share({ text }); markSent(items); toast("Shared for EM Bot"); }
    catch (e) { if (e.name !== "AbortError") toast("Could not open the share sheet"); }
    return;
  }
  if (await copyText(text)) {
    markSent(items);
    toast(items.length > 1 ? `${items.length} edits copied. Paste in your chat with EM Bot.` : "Copied. Paste it in your chat with EM Bot.");
  } else toast("Could not copy. Try Share instead.");
}

/* ---------- Editor ---------- */

const readDraft = () => {

};
const clearDraft = () => { clearTimeout(ED.draftTimer); try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} };

function openEditor(i, draftText) {

  ED.key = i.key; ED.baseId = i.baseId; ED.platform = i.platform; ED.start = i.postText || "";

function closeEditor() {

function edItem() { return S.byKey.get(ED.key) || S.items.find((x) => x.baseId === ED.baseId) || null; }
function edUpdate() {
  const i = edItem(), text = $("#ed-text").value, sheet = sheetTextOf(ED.baseId);

  $("#ed-meta").innerHTML = `${i ? chip(i.platform, i.status, i) : ""}<span class="nm">${esc(i ? i.title : "")}</span><span class="ccount${c.over ? " over" : ""}">${esc(c.label)}</span>`;

  if (dashes.length) w += `<div class="wline"><span>${dashes.length} em dash${dashes.length > 1 ? "es" : ""}. Your rule: no em dashes.</span><button data-act="edfind" data-what="dash">Show</button></div>`;
  if (emoji.length) w += `<div class="wline"><span>${emoji.length} emoji. Your rule: no emoji in post text.</span><button data-act="edfind" data-what="emoji">Show</button></div>`;
  if (i && i.editStale) w += `<div class="wline"><span>The Sheet text changed after your edit.</span><button data-act="edorig">${$("#ed-orig").classList.contains("hidden") ? "See it" : "Hide"}</button></div>`;
  $("#ed-warn").innerHTML = w;

function edDirty() { return cleanText($("#ed-text").value) !== cleanText(ED.start); }
function edCancel() {
  if (edDirty() && !ED.armed) {
    // Two taps to throw away typing, so a stray tap does not lose work.
    ED.armed = true;
    $("#ed-cancel").textContent = "Discard?"; $("#ed-cancel").classList.add("armed");
    clearTimeout(ED.armTimer);

    return;
  }

}
function edSave() {
  const text = cleanText($("#ed-text").value);
  const baseId = ED.baseId, sheet = sheetTextOf(baseId);
  const cur = S.overrides[baseId] && S.overrides[baseId].edit;
  if (!text.trim() && !(cur && !sheet.trim())) return;
  closeEditor();
  if (normText(text) === normText(sheet)) {
    if (cur) setEdit(baseId, null, "Matches the Sheet text. Edit removed.");
    else toast("No changes");
    return;
  }
  if (cur && cur.text === text && normText(cur.base) === normText(sheet)) { toast("No changes"); return; }
  setEdit(baseId, { text, base: sheet, at: new Date().toISOString(), sentAt: null }, "Edit saved");
}
function edFind(what) {
  const ta = $("#ed-text"), hits = findAll(what === "dash" ? EM_DASH : EMOJI, ta.value);
  if (!hits.length) return;
  const from = ta.selectionEnd || 0;
  const h = hits.find((x) => x.i >= from) || hits[0];
  ta.focus();
  ta.setSelectionRange(h.i, h.i + h.n);
  // Rough scroll so the selection is on screen when the browser does not do it.
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 23;
  const line = ta.value.slice(0, h.i).split("\n").length - 1;
  if (line * lh < ta.scrollTop || line * lh > ta.scrollTop + ta.clientHeight - lh) ta.scrollTop = Math.max(0, line * lh - ta.clientHeight / 3);
}
/* Keep the editor inside the visible area when the iPhone keyboard is up. */
function fitEditor() {
  const ed = $("#editor");
  if (ed.hidden) return;
  const vv = window.visualViewport;
  if (!vv) return;
  ed.style.height = vv.height + "px";
  ed.style.top = vv.offsetTop + "px";
  ed.classList.toggle("kb", vv.height < window.innerHeight - 120);
}
if (window.visualViewport) {

}

function markPosted(i) {

function unpost(i) {

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act],[data-tab]");
  if (!el) return;
  if (el.dataset.tab) { setView(el.dataset.tab); return; }
  const act = el.dataset.act, i = el.dataset.key ? S.byKey.get(el.dataset.key) : null;
  switch (act) {
    case "sheet": if (i) postSheet(i); break;
    case "copy": if (i && (await copyText(i.postText))) toast("Copied with line breaks"); break;
    case "open":
      if (!i) break;
      if (await copyText(i.postText)) toast("Copied. Opening " + (PLATFORM_NAME[i.platform] || i.platform));
      if (OPEN_APP[i.platform]) setTimeout(() => { location.href = OPEN_APP[i.platform](i.postText); }, 150);
      break;
    case "posted": if (i) { markPosted(i); if (sheetKey) closeSheet(); } break;
    case "unpost": if (i) { unpost(i); if (sheetKey) closeSheet(); } break;
    case "resched": if (i) reschedSheet(i); break;
    case "pickdate": $("#rdate").value = el.dataset.date; break;
    case "doresched": if (i) reschedule(i, $("#rdate").value); break;
    case "save":
      if (i && S.prepared[i.key]) {
        try { await navigator.share({ files: S.prepared[i.key] }); } catch (e) { if (e.name !== "AbortError") toast("Could not open the share sheet"); }
      }
      break;
    case "pending": pendingSheet(); break;
    case "copylist": if (await copyText(pendingChanges().join("\n"))) toast("List copied"); break;
    case "theme": setTheme(el.dataset.theme); break;
    case "day":
      S.selected = el.dataset.date;
      S.month = S.selected.slice(0, 7);
      if (S.view !== "calendar") setView("calendar");
      else { renderMonth(); scrollStripTo(S.selected, true); }
      break;
    case "daysheet": daySheet(el.dataset.date); break;
    case "pbpost": pbPostSheet(el.dataset.id); break;
    case "pbtoggle": pbToggleRule(el); break;
    case "pbjump": {
      const t = document.getElementById(el.dataset.target);
      if (!t) break;

      el.parentNode.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el));
      t.scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(pbSpy, 1250);
      break;
    }
    case "rcopy": {
      const r = findReply(el.dataset.rid);

      if (await copyText(r.draftText)) {
        const label = el.innerHTML;
        el.innerHTML = `${ICON.check} Copied`; el.classList.add("ok");
        toast("Reply copied");

      } else toast("Could not copy. Press and hold the reply text to copy it.");

    case "rskip": if (findReply(el.dataset.rid)) markReply(el.dataset.rid, "skipped"); break;
    case "rmore": {
      const id = el.dataset.rid, q = el.closest(".rcard") && el.closest(".rcard").querySelector(".rq");

    case "edcancel": edCancel(); break;

    case "edfind": edFind(el.dataset.what); break;
    case "edorig": $("#ed-orig").classList.toggle("hidden"); edUpdate(); break;
    case "eduseorig": $("#ed-text").value = sheetTextOf(ED.baseId); $("#ed-text").dispatchEvent(new Event("input")); break;
    case "edrevert": if (i) revertEdit(i); break;

    case "draftresume": { const d = readDraft(), it = d && S.byKey.get(d.key); if (it) openEditor(it, d.text); break; }
    case "draftdrop": clearDraft(); render(); break;
    case "signin": location.reload(); break;
    case "close": closeSheet(); break;
  }
});

/* ---------- Swipe actions on Today cards ---------- */
(() => {
  const TH = 90;
  let fg = null, card = null, x0 = 0, y0 = 0, dx = 0, mode = null;
  const root = $("#v-today");
  root.addEventListener("pointerdown", (e) => {
    const c = e.target.closest(".card[data-swipe]");
    if (!c || e.target.closest("button,a") || e.pointerType === "mouse" && e.button !== 0) return;
    card = c; fg = c.querySelector(".fg"); x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null;
  });
  root.addEventListener("pointermove", (e) => {
    if (!fg) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!mode) {
      if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
      mode = Math.abs(ddx) > Math.abs(ddy) ? "h" : "v";
      if (mode === "h") { fg.classList.add("dragging"); try { fg.setPointerCapture(e.pointerId); } catch (_) {} }
    }
    if (mode !== "h") return;
    dx = ddx;
    fg.style.transform = `translateX(${dx}px)`;
    card.classList.toggle("go-r", dx > 0); card.classList.toggle("go-l", dx < 0);
  });
  const end = () => {
    if (!fg) return;
    const i = S.byKey.get(card.dataset.key), d = dx, f = fg, c = card;
    f.classList.remove("dragging");
    f.style.transform = "";
    setTimeout(() => c.classList.remove("go-r", "go-l"), 200);
    fg = card = null;
    if (mode === "h" && i) {
      if (d > TH) markPosted(i);
      else if (d < -TH) reschedSheet(i);
    }
    mode = null;
  };
  root.addEventListener("pointerup", end);
  root.addEventListener("pointercancel", end);
})();
